<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SkiFree (web)</title>
<style>
  body { background: #000; margin: 0; }
  /* 1:1 pixels when the viewport fits 1024px; below that, scale the
     WHOLE screen down with nearest-neighbour (crisp — the status panel
     font is 12px and blurs badly under fractional resampling). The
     boot.js mouse mapping divides by the rect scale, so input stays
     exact at any CSS size. */
  canvas {
    display: block;
    margin: 0 auto;
    width: min(100vw, 1024px);
    height: auto;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<!-- The canvas is the reference screen (1024x768; the main window client
     lands at (132,30), exactly where the reference Xvfb placed it —
     shim/canvas.c). T20 boot smoke: bare canvas + module glue; T22
     polishes the page. -->
<canvas id="canvas" width="1024" height="768"></canvas>
<script src="ski.js"></script>
<script src="boot.js"></script>
</body>
</html>
